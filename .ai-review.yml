# AI Code Review settings (all optional)
provider: anthropic       # gemini | anthropic | openai
# model: claude-haiku-5-5  # cheap and fast; use claude-sonnet-5-5 for deeper reviews
min_severity: minor       # minor | major | critical
max_files: 20
max_comments_per_file: 5
ignore:
  - "docs/*"
rules:
  - Never log full request bodies; they can contain customer PII.
  - Database queries must use parameters, never string formatting.
